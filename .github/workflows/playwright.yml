name: Run Playwright flow

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: batch-state-${{ github.run_id }}
          restore-keys: |
            batch-state-

      - name: Run login flow
        env:
          HEADLESS: 'true'
          ALLOW_LIVE_RUN: 'true'
          ONEXBET_USERNAME: ${{ secrets.ONEXBET_USERNAME }}
          ONEXBET_PASSWORD: ${{ secrets.ONEXBET_PASSWORD }}
          ONEXBET_SURNAME: ${{ secrets.ONEXBET_SURNAME }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MAX_RETRIES: ${{ vars.MAX_RETRIES }}
        run: npm run login

      - name: Save state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: batch-state-${{ github.run_id }}

      - name: Upload run summary
        uses: actions/upload-artifact@v4
        with:
          name: run-summary
          path: run-summary.json
          if-no-files-found: warn

      - name: Render step summary
        if: always()
        run: |
          if [ -f run-summary.json ]; then
            node --input-type=module -e "
              import { readFileSync, appendFileSync } from 'fs';
              import { formatSummary } from './lib/runSummary.js';
              const summary = JSON.parse(readFileSync('run-summary.json', 'utf8'));
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Run summary\n\n' + formatSummary(summary) + '\n');
            "
          else
            echo '## Run summary' >> "$GITHUB_STEP_SUMMARY"
            echo 'No run-summary.json produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
